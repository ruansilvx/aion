# Builds and packages Windows (Inno Setup) + Linux (AppImage) installers
# on a version-tag push, then attaches both to a GitHub Release. No
# model-API credentials of any kind live here — changelog drafting and
# version bumping happen locally, before tagging, via the
# /prepare-release skill (aion-arch/.claude/skills/prepare-release/).
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: dart run build_runner build

      - run: flutter build windows --release

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install agent_bridge dependencies
        run: npm ci --omit=dev
        working-directory: agent_bridge

      # @anthropic-ai/claude-agent-sdk vendors a prebuilt ripgrep binary
      # for every platform it supports (~55MB across 5 dirs) — this
      # installer only ever runs on Windows, so the other 4 are pure
      # dead weight in every Aion-Setup-*.exe otherwise.
      - name: Prune non-Windows vendor binaries from agent_bridge
        shell: pwsh
        run: |
          $vendor = "agent_bridge/node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep"
          if (Test-Path $vendor) {
            Get-ChildItem $vendor -Directory | Where-Object { $_.Name -ne "x64-win32" } | Remove-Item -Recurse -Force
          }

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" windows\installer\aion.iss

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: windows/installer/Output/Aion-Setup-*.exe

  build-linux:
    runs-on: ubuntu-latest
    # A Linux-side failure must never block a Windows-only release — see
    # aion-arch/changes/v1-release-readiness/design.md Section 2. Still
    # shows red in the Actions UI; just doesn't fail `publish-release`'s
    # `needs:` gate downstream.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux build dependencies
        run: |
          # ubuntu-latest runner images bundle a Google Chrome apt source by
          # default, unrelated to this build (we need neither Chrome nor any
          # of its packages) — its mirror has been observed serving a
          # transient Hash Sum mismatch, which fails `apt-get update` outright
          # even though every repo we actually need is fine. Drop it before
          # updating so a flaky, irrelevant third-party mirror can't take
          # this job down.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev imagemagick

      - run: flutter pub get

      - run: dart run build_runner build

      - run: flutter build linux --release

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install agent_bridge dependencies
        run: npm ci --omit=dev
        working-directory: agent_bridge

      # See the matching Windows-side prune step in build-windows above —
      # this AppImage only ever runs on Linux, so the other 4 platforms'
      # vendored ripgrep binaries (~55MB total) are dead weight here too.
      - name: Prune non-Linux vendor binaries from agent_bridge
        run: |
          vendor="agent_bridge/node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep"
          if [ -d "$vendor" ]; then
            find "$vendor" -mindepth 1 -maxdepth 1 -type d ! -name "x64-linux" -exec rm -rf {} +
          fi

      - name: Build AppImage
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash linux/packaging/build_appimage.sh "$version"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: Aion-*-x86_64.AppImage

  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: artifacts/windows-installer

      # A missing Linux artifact (build-linux failed upstream, see its
      # continue-on-error above) must not fail this job — a Windows-only
      # release is the accepted degraded outcome for this release. Kept
      # as its own step so only this download is allowed to fail.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: linux-appimage
          path: artifacts/linux-appimage

      - name: Extract changelog section for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          ver_regex=$(echo "$version" | sed 's/\./\\./g')
          awk -v ver="$ver_regex" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(artifacts/windows-installer/*.exe)
          shopt -s nullglob
          linux_assets=(artifacts/linux-appimage/*.AppImage)
          shopt -u nullglob
          if [ ${#linux_assets[@]} -gt 0 ]; then
            assets+=("${linux_assets[@]}")
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release_notes.md \
            "${assets[@]}"
