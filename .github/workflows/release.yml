# Builds and packages Windows (Inno Setup) + Linux (AppImage) installers
# on a version-tag push, then attaches both to a GitHub Release. No
# model-API credentials of any kind live here — changelog drafting and
# version bumping happen locally, before tagging, via the
# /prepare-release skill (aion-arch/.claude/skills/prepare-release/).
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" windows\installer\aion.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: windows/installer/Output/Aion-Setup-*.exe

  build-linux:
    runs-on: ubuntu-latest
    # A Linux-side failure must never block a Windows-only release — see
    # aion-arch/changes/v1-release-readiness/design.md Section 2. Still
    # shows red in the Actions UI; just doesn't fail `publish-release`'s
    # `needs:` gate downstream.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev

      - run: flutter pub get

      - run: flutter build linux --release

      - name: Build AppImage
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash linux/packaging/build_appimage.sh "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: Aion-*-x86_64.AppImage

  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows-installer

      # A missing Linux artifact (build-linux failed upstream, see its
      # continue-on-error above) must not fail this job — a Windows-only
      # release is the accepted degraded outcome for this release. Kept
      # as its own step so only this download is allowed to fail.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: linux-appimage
          path: artifacts/linux-appimage

      - name: Extract changelog section for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          ver_regex=$(echo "$version" | sed 's/\./\\./g')
          awk -v ver="$ver_regex" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(artifacts/windows-installer/*.exe)
          shopt -s nullglob
          linux_assets=(artifacts/linux-appimage/*.AppImage)
          shopt -u nullglob
          if [ ${#linux_assets[@]} -gt 0 ]; then
            assets+=("${linux_assets[@]}")
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release_notes.md \
            "${assets[@]}"
